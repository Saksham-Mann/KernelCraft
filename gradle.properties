# Allocate sufficient JVM heap to the Gradle daemon for D8/R8 dex merging & Compose compiler
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Enable AndroidX and modern Jetpack libraries
android.useAndroidX=true
android.nonTransitiveRClass=true

# Build performance optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Dependency verification override
org.gradle.dependency.verification=off
