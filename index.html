<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>KernelCraft • From Silicon to Syscall</title>

    <!-- Global Typography System: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- CSS Root Variables & Universal Resets -->
    <style>
      :root {
        --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }

      *,
      html,
      body,
      button,
      input,
      textarea,
      select,
      [dir="auto"] {
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      code,
      pre,
      kbd,
      samp,
      .font-mono {
        font-family: var(--font-mono);
      }

      /* Hide native browser scrollbars globally while preserving scrollability */
      ::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
      }

      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
